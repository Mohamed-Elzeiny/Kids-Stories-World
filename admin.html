<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة رفع الكتب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Fredoka:wght@500;600&family=Lalezar&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<span id="admin-marker" hidden></span>

<header class="topbar">
  <div class="band-inner">
    <button type="button" id="lang-btn" class="lang-btn" data-i18n="langBtn">English</button>
  </div>
</header>

<div class="hero slim">
  <div class="band-inner">
    <div class="hero-text">
      <p class="eyebrow" data-i18n="aEyebrow">خاصة بصاحب الموقع</p>
      <h1 data-i18n="adminTitle">لوحة رفع الكتب</h1>
      <p class="lead" data-i18n="aLead">ارفع كتابًا جديدًا أو احذف كتابًا قديمًا.</p>
    </div>
  </div>
</div>

<main>
  <div class="band-inner">

    <!-- شاشة الدخول / الإعداد -->
    <section class="panel" id="lock-screen" aria-labelledby="lock-title">
      <h2 id="lock-title"></h2>
      <p class="note" id="lock-note"></p>
      <form id="lock-form" novalidate autocomplete="off">
        <div class="field">
          <label for="l-user" data-i18n="lUser">اسم المستخدم</label>
          <input type="text" id="l-user" dir="ltr" autocomplete="username">
        </div>
        <div class="field">
          <label for="l-pass" id="l-pass-label" data-i18n="lPass">كلمة المرور</label>
          <input type="password" id="l-pass" dir="ltr" autocomplete="current-password">
        </div>
        <div class="field setup-only">
          <label for="c-owner" data-i18n="cOwner">اسم المستخدم على GitHub</label>
          <input type="text" id="c-owner" dir="ltr" autocomplete="off" placeholder="username">
        </div>
        <div class="field setup-only">
          <label for="c-repo" data-i18n="cRepo">اسم المستودع</label>
          <input type="text" id="c-repo" dir="ltr" autocomplete="off" placeholder="stories-site">
        </div>
        <div class="field setup-only">
          <label for="c-branch" data-i18n="cBranch">الفرع</label>
          <input type="text" id="c-branch" dir="ltr" autocomplete="off" value="main">
        </div>
        <div class="field setup-only">
          <label for="c-token" data-i18n="cToken">مفتاح الوصول</label>
          <input type="password" id="c-token" dir="ltr" autocomplete="off" placeholder="github_pat_...">
        </div>
        <div class="form-foot">
          <button class="btn" type="submit" id="l-submit"></button>
          <button class="btn small danger" type="button" id="l-reset" data-i18n="lReset">نسيت كلمة المرور أو أريد البدء من جديد</button>
          <p class="status" id="l-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <!-- لوحة الإدارة بعد الدخول -->
    <div id="app-screen" hidden>
      <section class="panel" aria-labelledby="add-title">
        <div class="section-head">
          <h2 id="add-title" data-i18n="addTitle">2. إضافة كتاب جديد</h2>
          <button class="btn small danger" type="button" id="logout" data-i18n="lLogout">تسجيل الخروج</button>
        </div>
        <p class="note" data-i18n="addNote">ملف الكتاب بصيغة PDF.</p>
        <p class="note" id="conn-info"></p>
        <form id="book-form" novalidate>
          <div class="field">
            <label for="f-title-ar" data-i18n="fTitleAr">عنوان القصة (عربي)</label>
            <input type="text" id="f-title-ar" maxlength="80" data-i18n-ph="fPhTitleAr" placeholder="">
          </div>
          <div class="field">
            <label for="f-title-en" data-i18n="fTitleEn">عنوان القصة (إنجليزي)</label>
            <input type="text" id="f-title-en" dir="ltr" maxlength="80" data-i18n-ph="fPhTitleEn" placeholder="">
          </div>
          <div class="field">
            <label for="f-age" data-i18n="fAge">الفئة العمرية</label>
            <select id="f-age">
              <option value="3-5" data-i18n="age_3-5">3 - 5 سنوات</option>
              <option value="6-8" data-i18n="age_6-8" selected>6 - 8 سنوات</option>
              <option value="9-12" data-i18n="age_9-12">9 - 12 سنة</option>
            </select>
          </div>
          <div class="field">
            <label for="f-category-ar" data-i18n="fCategoryAr">التصنيف (عربي، اختياري)</label>
            <input type="text" id="f-category-ar" maxlength="40">
          </div>
          <div class="field">
            <label for="f-category-en" data-i18n="fCategoryEn">Category (English, optional)</label>
            <input type="text" id="f-category-en" dir="ltr" maxlength="40">
          </div>
          <div class="field">
            <label for="f-pdf" data-i18n="fPdf">ملف الكتاب (PDF)</label>
            <input type="file" id="f-pdf" accept="application/pdf,.pdf">
          </div>
          <div class="field">
            <label for="f-sum-ar" data-i18n="fSumAr">نبذة قصيرة (عربي)</label>
            <textarea id="f-sum-ar" maxlength="300" data-i18n-ph="fPhSumAr" placeholder=""></textarea>
          </div>
          <div class="field">
            <label for="f-sum-en" data-i18n="fSumEn">نبذة قصيرة (إنجليزي)</label>
            <textarea id="f-sum-en" dir="ltr" maxlength="300" data-i18n-ph="fPhSumEn" placeholder=""></textarea>
          </div>
          <div class="field wide">
            <label for="f-cover" data-i18n="fCover">صورة الغلاف (اختياري)</label>
            <input type="file" id="f-cover" accept="image/png,image/jpeg,image/webp">
          </div>
          <div class="form-foot">
            <button class="btn" type="submit" id="f-submit" data-i18n="fSubmit">رفع الكتاب</button>
            <p class="status" id="f-status" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title" style="margin-top: 28px">
        <h2 id="list-title" data-i18n="listTitle">3. الكتب الحالية</h2>
        <ul class="manage" id="manage"></ul>
        <p class="status" id="m-status" role="status" aria-live="polite"></p>
      </section>
    </div>

    <p><a href="index.html" data-i18n="backSite">العودة إلى الموقع</a></p>
  </div>
</main>

<script src="i18n.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var T = I18N.t;
  var VAULT = "stories-vault-v1";
  var MAX_PDF = 25 * 1024 * 1024;
  var session = null;     /* { owner, repo, branch, token } في الذاكرة فقط */
  var books = [];
  var armed = null;
  var busy = false;
  var resetArmed = false;

  function h(tag, attrs, kids) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function say(id, text, kind) {
    var s = $(id);
    s.textContent = text || "";
    s.className = "status" + (kind ? " " + kind : "");
  }

  /* ---------- التشفير: كلمة المرور تحمي مفتاح GitHub على هذا الجهاز ---------- */
  var enc = new TextEncoder(), dec = new TextDecoder();
  function b64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function hasCrypto() { return !!(window.crypto && crypto.subtle); }

  function deriveKey(user, pass, salt) {
    return crypto.subtle.importKey("raw", enc.encode(user.trim().toLowerCase() + ":" + pass), "PBKDF2", false, ["deriveKey"])
      .then(function (k) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
          k, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
      });
  }
  function seal(user, pass, obj) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(user, pass, salt).then(function (key) {
      return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(JSON.stringify(obj)));
    }).then(function (ct) {
      return { v: 1, salt: b64(salt), iv: b64(iv), data: b64(ct) };
    });
  }
  function unseal(user, pass, v) {
    return deriveKey(user, pass, unb64(v.salt)).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(v.iv) }, key, unb64(v.data));
    }).then(function (pt) { return JSON.parse(dec.decode(pt)); });
  }
  function getVault() { try { return JSON.parse(localStorage.getItem(VAULT) || "null"); } catch (e) { return null; } }

  /* ---------- شاشة الدخول ---------- */
  function showLock() {
    var hasVault = !!getVault();
    $("lock-title").textContent = T(hasVault ? "loginTitle" : "setupTitle");
    $("lock-note").textContent = T(hasVault ? "loginNote" : "setupNote");
    $("l-submit").textContent = T(hasVault ? "lLoginBtn" : "lSetupBtn");
    $("l-pass-label").textContent = T(hasVault ? "lPass" : "lPassNew");
    $("l-pass").setAttribute("autocomplete", hasVault ? "current-password" : "new-password");
    document.querySelectorAll(".setup-only").forEach(function (n) { n.hidden = hasVault; });
    $("l-reset").hidden = !hasVault;
    $("l-reset").textContent = T(resetArmed ? "lResetConfirm" : "lReset");
    $("lock-screen").hidden = !!session;
    $("app-screen").hidden = !session;
    if (session) $("conn-info").textContent = T("connInfo") + session.owner + "/" + session.repo + " (" + session.branch + ")";
  }

  $("lock-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (busy) return;
    if (!hasCrypto()) { say("l-status", T("eNoCrypto"), "err"); return; }
    var user = $("l-user").value.trim(), pass = $("l-pass").value;
    if (!user || !pass) { say("l-status", T("mNeedUser"), "err"); return; }
    var vault = getVault();
    busy = true; $("l-submit").disabled = true; say("l-status", "…");

    var job;
    if (vault) {
      job = unseal(user, pass, vault).catch(function () { var e = new Error("wrong"); e.wrong = true; throw e; });
    } else {
      var cfg = {
        owner: $("c-owner").value.trim(), repo: $("c-repo").value.trim(),
        branch: $("c-branch").value.trim() || "main", token: $("c-token").value.trim()
      };
      if (pass.length < 8) { busy = false; $("l-submit").disabled = false; say("l-status", T("ePassShort"), "err"); return; }
      if (!cfg.owner || !cfg.repo || !cfg.token) { busy = false; $("l-submit").disabled = false; say("l-status", T("mNeedConn"), "err"); return; }
      job = seal(user, pass, cfg).then(function (v) {
        try { localStorage.setItem(VAULT, JSON.stringify(v)); } catch (e) {}
        return cfg;
      });
    }
    job.then(function (cfg) {
      session = cfg;
      $("l-pass").value = ""; $("c-token").value = "";
      say("l-status", "");
      showLock();
      refresh();
    }).catch(function (e) {
      say("l-status", e && e.wrong ? T("eWrong") : T("eOther"), "err");
    }).then(function () { busy = false; $("l-submit").disabled = false; });
  });

  $("l-reset").addEventListener("click", function () {
    if (!resetArmed) {
      resetArmed = true; showLock();
      setTimeout(function () { resetArmed = false; showLock(); }, 5000);
      return;
    }
    try { localStorage.removeItem(VAULT); } catch (e) {}
    resetArmed = false; session = null; say("l-status", ""); showLock();
  });

  $("logout").addEventListener("click", function () {
    session = null; books = []; renderList(); say("l-status", ""); showLock();
  });

  /* ---------- GitHub ---------- */
  function gh(method, path, body) {
    var c = session;
    var url = "https://api.github.com/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/contents/" + path;
    if (method === "GET") url += "?ref=" + encodeURIComponent(c.branch) + "&t=" + Date.now();
    return fetch(url, {
      method: method,
      headers: {
        "Authorization": "Bearer " + c.token,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      if (r.status === 204) return {};
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.message || r.status); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function errText(e) {
    var s = e && e.status;
    if (s === 401) return T("e401");
    if (s === 403) return T("e403");
    if (s === 404) return T("e404");
    if (s === 409 || s === 422) return T("e409");
    if (!s) return T("eNet");
    return T("eOther") + " (" + s + ")";
  }

  function blobB64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(",")[1]); };
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }
  function textB64(s) { return b64(enc.encode(s)); }
  function b64Text(s) { return dec.decode(unb64(s.replace(/\s/g, ""))); }

  function shrinkCover(file) {
    return new Promise(function (res, rej) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var w = Math.min(600, img.width), ratio = img.width ? w / img.width : 1;
        var cv = document.createElement("canvas");
        cv.width = Math.round(img.width * ratio);
        cv.height = Math.round(img.height * ratio);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        cv.toBlob(function (b) { b ? res(b) : rej(new Error("cover")); }, "image/jpeg", 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("cover")); };
      img.src = url;
    });
  }

  function loadBooks() {
    return gh("GET", "books.json").then(function (f) {
      var list = [];
      try { list = JSON.parse(b64Text(f.content)); } catch (e) { list = []; }
      return { list: Array.isArray(list) ? list : [], sha: f.sha };
    }).catch(function (e) {
      if (e.status === 404) return { list: [], sha: null };
      throw e;
    });
  }
  function saveBooks(list, sha, message) {
    var body = { message: message, content: textB64(JSON.stringify(list, null, 2) + "\n"), branch: session.branch };
    if (sha) body.sha = sha;
    return gh("PUT", "books.json", body);
  }

  function renderList() {
    var ul = $("manage");
    ul.textContent = "";
    if (!books.length) {
      ul.appendChild(h("li", {}, [h("span", { class: "t", text: T("noBooks") })]));
      return;
    }
    books.forEach(function (b) {
      var isArmed = armed === b.id;
      var ageKey = "age_" + b.age;
      ul.appendChild(h("li", {}, [
        h("span", { class: "t" }, [document.createTextNode(I18N.pick(b, "title")), h("small", { text: T(ageKey) === ageKey ? (b.age || "") : T(ageKey) })]),
        h("button", {
          class: "btn small danger", type: "button", text: isArmed ? T("delConfirm") : T("del"),
          onclick: function () {
            if (!isArmed) {
              armed = b.id; renderList();
              setTimeout(function () { if (armed === b.id) { armed = null; renderList(); } }, 4000);
            } else { removeBook(b); }
          }
        })
      ]));
    });
  }

  function refresh() {
    say("m-status", T("mChecking"));
    return loadBooks().then(function (r) {
      books = r.list;
      renderList();
      say("m-status", T("mConnected") + books.length, "ok");
    }).catch(function (e) { say("m-status", errText(e), "err"); });
  }

  $("book-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (busy || !session) return;
    var titleAr = $("f-title-ar").value.trim(), titleEn = $("f-title-en").value.trim();
    var pdf = $("f-pdf").files[0];
    var cover = $("f-cover").files[0];
    if (!titleAr && !titleEn) { say("f-status", T("mNeedTitle"), "err"); return; }
    if (!pdf) { say("f-status", T("mNeedPdf"), "err"); return; }
    if (pdf.size > MAX_PDF) { say("f-status", T("mPdfBig"), "err"); return; }

    busy = true;
    $("f-submit").disabled = true;
    var id = "b" + Date.now().toString(36);
    var filePath = "books/" + id + ".pdf";
    var coverPath = cover ? "covers/" + id + ".jpg" : "";
    var branch = session.branch;
    var label = titleEn || titleAr;

    say("f-status", T("mUpPdf"));
    blobB64(pdf).then(function (data) {
      return gh("PUT", filePath, { message: "Add book: " + label, content: data, branch: branch });
    }).then(function () {
      if (!cover) return null;
      say("f-status", T("mUpCover"));
      return shrinkCover(cover).then(blobB64).then(function (data) {
        return gh("PUT", coverPath, { message: "Cover: " + label, content: data, branch: branch });
      });
    }).then(function () {
      say("f-status", T("mUpList"));
      return loadBooks();
    }).then(function (r) {
      var book = {
        id: id, title: titleAr, titleEn: titleEn,
        summary: $("f-sum-ar").value.trim(), summaryEn: $("f-sum-en").value.trim(),
        age: $("f-age").value, file: filePath, cover: coverPath,
        category: $("f-category-ar").value.trim(), categoryEn: $("f-category-en").value.trim()
      };
      var next = [book].concat(r.list);
      return saveBooks(next, r.sha, "Update book list").then(function () { books = next; });
    }).then(function () {
      $("book-form").reset();
      renderList();
      say("f-status", T("mDone"), "ok");
    }).catch(function (e) {
      say("f-status", errText(e), "err");
    }).then(function () { busy = false; $("f-submit").disabled = false; });
  });

  function removeBook(b) {
    if (busy || !session) return;
    busy = true;
    armed = null;
    var branch = session.branch;
    loadBooks().then(function (r) {
      var next = r.list.filter(function (x) { return x.id !== b.id; });
      return saveBooks(next, r.sha, "Remove book: " + (b.titleEn || b.title || "")).then(function () { books = next; });
    }).then(function () {
      var paths = [b.file, b.cover].filter(Boolean);
      return Promise.all(paths.map(function (p) {
        return gh("GET", p).then(function (f) {
          return gh("DELETE", p, { message: "Remove file", sha: f.sha, branch: branch });
        }).catch(function () {});
      }));
    }).then(function () {
      renderList();
      say("m-status", T("mDeleted"), "ok");
    }).catch(function (e) {
      say("m-status", errText(e), "err");
      renderList();
    }).then(function () { busy = false; });
  }

  I18N.on(function () { showLock(); renderList(); });
  showLock();
})();
</script>
</body>
</html>

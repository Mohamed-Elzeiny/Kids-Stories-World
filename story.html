<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff9ee">
<title>قصة — حديقة الحكايات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container nav-row">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">✿</span><span data-site-text="siteName">مكتبة الحكايات</span></a>
  <nav class="main-nav"><a href="index.html#stories" data-i18n="storyBack">العودة إلى القصص</a></nav>
  <button type="button" id="lang-btn" class="lang-btn" data-i18n="langBtn">English</button>
</div></header>
<main class="story-page container">
  <a class="back-link" href="index.html#stories"><span aria-hidden="true">←</span> <span data-i18n="storyBack">العودة إلى القصص</span></a>
  <p class="site-config-warning" id="site-config-warning" role="status" data-i18n="siteConfigLoadError" hidden>تعذر تحميل إعدادات المظهر المحفوظة. تُعرض الألوان الافتراضية مؤقتًا.</p>
  <div id="story-content" aria-live="polite" aria-busy="true"></div>
</main>
<footer class="site-footer"><div class="container footer-row"><span><span aria-hidden="true">✿</span> <span data-i18n="footer">حكاية جميلة قد تجعل يومك أجمل.</span></span><a href="index.html" data-i18n="navStories">القصص</a></div></footer>
<script src="i18n.js"></script>
<script src="site-config.js"></script>
<script>
(function () {
  var siteConfig = SiteConfig.defaults();
  function applySiteConfig() { SiteConfig.apply(siteConfig); }
  function configuredSiteName() { return siteConfig.siteName[I18N.lang] || siteConfig.siteName[I18N.lang === "en" ? "ar" : "en"]; }
  var area = document.getElementById("story-content");
  var id = new URLSearchParams(window.location.search).get("id");
  var stories = [], galleryIndex = 0;
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) { if (key === "text") n.textContent = attrs[key]; else n.setAttribute(key, attrs[key]); });
    (children || []).forEach(function (child) { if (child) n.appendChild(child); });
    return n;
  }
  function ageLabel(age) { var key = "age_" + age; return I18N.t(key) === key ? age : I18N.t(key); }
  function mediaPath(item) { return typeof item === "string" ? item : item && (item.src || item.url || item.file || ""); }
  function selectedText(story, names) {
    var language = I18N.lang === "en" ? "En" : "";
    for (var i = 0; i < names.length; i++) {
      var candidate = story[names[i] + language] || story[names[i]];
      if (typeof candidate === "string" && candidate.trim()) return candidate;
    }
    return "";
  }
  function render() {
    area.textContent = "";
    var story = stories.find(function (item) { return item.id === id; });
    if (!story) {
      document.title = I18N.t("storyMissingTitle") + " — " + configuredSiteName();
      area.appendChild(el("section", { class: "empty-state story-empty" }, [el("span", { class: "empty-icon", text: "✿" }), el("h1", { text: I18N.t("storyMissingTitle") }), el("p", { text: I18N.t("storyMissing") }), el("a", { class: "btn", href: "index.html#stories", text: I18N.t("storyBack") })]));
      return;
    }
    galleryIndex = Math.min(galleryIndex, Math.max(0, (story.images || story.gallery || []).length - 1));
    var title = I18N.pick(story, "title") || I18N.t("untitledStory");
    var summary = I18N.pick(story, "summary");
    var category = I18N.pick(story, "category");
    var storyText = selectedText(story, ["storyText", "text", "body"]);
    var audio = mediaPath((I18N.lang === "en" && story.audioEn) || story.audio || story.audioFile || "");
    var images = Array.isArray(story.images) ? story.images : (Array.isArray(story.gallery) ? story.gallery : []);
    images = images.filter(function (image) { return !!mediaPath(image); });
    document.title = title + " — " + configuredSiteName();
    var heading = el("header", { class: "story-heading" }, [
      story.cover ? el("img", { class: "story-cover", src: story.cover, alt: I18N.t("coverAlt") + title }) : null,
      story.age ? el("span", { class: "age-tag", text: ageLabel(story.age) }) : null,
      category ? el("span", { class: "age-tag category-detail", text: I18N.t("storyCategory") + ": " + category }) : null,
      el("h1", { text: title }),
      summary ? el("p", { text: summary }) : null
    ]);
    var content = [heading];
    if (storyText) content.push(el("section", { class: "story-text-panel" }, [el("h2", { text: I18N.t("storyText") }), el("div", { class: "story-text-body", text: storyText })]));
    if (story.file) {
      var reader = el("section", { class: "reader-panel", "aria-label": I18N.t("storyRead") }, [
        el("div", { class: "reader-heading" }, [el("h2", { text: I18N.t("storyRead") }), el("a", { class: "btn small", href: story.file, target: "_blank", rel: "noopener", text: I18N.t("pdfOpenNew") })]),
        el("p", { class: "reader-hint", text: I18N.t("pdfFallback") }),
        el("iframe", { class: "pdf-reader", src: story.file, title: title })
      ]);
      content.push(reader);
    } else {
      if (!storyText && !audio && !images.length) content.push(el("section", { class: "empty-state" }, [el("span", { class: "empty-icon", text: "📖" }), el("p", { text: I18N.t("storyNoFile") })]));
    }
    if (images.length) {
      var current = images[galleryIndex] || images[0];
      var galleryChildren = [el("h2", { text: I18N.t("storyGallery") }), el("div", { class: "gallery-frame" }, [el("img", { src: mediaPath(current), alt: (current && current.alt) || (I18N.t("storyGallery") + " — " + title), loading: "lazy" })])];
      if (images.length > 1) {
        var count = el("span", { class: "gallery-count", text: (galleryIndex + 1) + " / " + images.length });
        galleryChildren.push(el("div", { class: "gallery-control" }, [
          el("button", { type: "button", text: I18N.t("previousImage") + " ←" }), count,
          el("button", { type: "button", text: "→ " + I18N.t("nextImage") })
        ]));
        var buttons = galleryChildren[galleryChildren.length - 1].querySelectorAll("button");
        buttons[0].addEventListener("click", function () { galleryIndex = (galleryIndex - 1 + images.length) % images.length; render(); });
        buttons[1].addEventListener("click", function () { galleryIndex = (galleryIndex + 1) % images.length; render(); });
      }
      content.push(el("section", { class: "gallery-panel" }, galleryChildren));
    }
    if (audio) content.push(el("section", { class: "audio-panel" }, [el("h2", { text: I18N.t("storyAudio") }), el("audio", { controls: "controls", preload: "metadata", src: audio }, [el("a", { href: audio, text: I18N.t("storyAudio") })])]));
    area.appendChild(el("article", { class: "story-detail" }, content));
  }
  I18N.on(function () { applySiteConfig(); render(); });
  applySiteConfig();
  SiteConfig.load().then(function (settings) { siteConfig = settings; applySiteConfig(); render(); }).catch(function () {
    document.getElementById("site-config-warning").hidden = false;
  });
  fetch("books.json?v=" + Date.now()).then(function (response) { if (!response.ok) throw new Error(response.status); return response.json(); }).then(function (data) { stories = Array.isArray(data) ? data : []; area.setAttribute("aria-busy", "false"); render(); }).catch(function () {
    area.setAttribute("aria-busy", "false"); area.textContent = "";
    area.appendChild(el("section", { class: "empty-state story-empty" }, [el("h1", { text: I18N.t("loadErrorTitle") }), el("p", { text: I18N.t("loadFail") }), el("a", { class: "btn", href: "index.html#stories", text: I18N.t("storyBack") })]));
  });
})();
</script>
</body>
</html>
